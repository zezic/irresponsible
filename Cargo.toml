[package]
name = "irresponsible"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.6", default-features = false }
unicode-segmentation = "1.13"
unicode-normalization = "0.1.25"
cpal = "0.18.2"
directories = "6"
hound = "3.5"
parley = "0.9"
percent-encoding = "2"
pollster = "0.4"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
rtrb = "0.3"
rubato = "0.16"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tray-icon = "0.25"
vello = "0.9"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphics", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["SMAppService", "objc2", "objc2-foundation", "std"] }

[features]
alloc-audit = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package.metadata.bundle]
name = "IRresponsible"
identifier = "com.zezic.irresponsible"
category = "Music"
osx_info_plist_exts = ["assets/Info.plist"]
