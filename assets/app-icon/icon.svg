<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>IRresponsible</title>
  <desc>A bright violet Dirac impulse rises from a zero baseline on a near-black macOS app tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop stop-color="#0d0c13"/>
      <stop offset="0.52" stop-color="#09080f"/>
      <stop offset="1" stop-color="#06060c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="impulse" gradientUnits="userSpaceOnUse" x1="512" y1="300" x2="512" y2="720">
      <stop stop-color="#c98aff"/>
      <stop offset="0.5" stop-color="#c384ff"/>
      <stop offset="1" stop-color="#bf7eff"/>
    </linearGradient>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="186" fill="url(#tile)"/>
  <rect x="97.5" y="97.5" width="829" height="829" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <path d="M280 690H744 M512 690V324 M454 382L512 324L570 382" fill="none" stroke="url(#impulse)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
