function section(title,ico,content,extra=''){return `<section class="section ${extra}"><div class="section-head">${icon(ico)}<strong>${title}</strong></div>${content}</section>`}
function toggle(label,on,action){return `<button class="toggle ${on?'active':''}" role="switch" aria-checked="${on}" aria-label="${label}" data-action="${action}"></button>`}
function select(label,values,value,field,cls=''){return `<select aria-label="${label}" data-field="${field}" class="${cls}">${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function bar(label,value,min,max,step,field,display){return `<label class="bar" style="--fill:${100*(value-min)/(max-min)}%"><span>${label}</span><output>${display}</output><input type="range" aria-label="${label}" min="${min}" max="${max}" step="${step}" value="${value}" data-field="${field}"></label>`}
function setupRows(){return `<div class="setting"><label>Microphone calibration</label>${toggle('Microphone calibration',state.calibration,'calibration')}</div><p class="caption">${state.calibration?'700-1285_90deg.txt / upward orientation':'No calibration / relative response'}</p><div class="setting"><label>Sweep duration</label>${select('Sweep duration',['4 s','8 s','16 s'],state.sweep,'sweep')}</div><div class="setting"><label>Fine LF measurement</label>${toggle('Fine LF measurement',state.lfDetail,'lfDetail')}</div><p class="caption">${state.lfDetail?'Additional 16 s sweep / 20-300 Hz':'Full-range sweep only'}</p>`}
function guide(){const steps=[['setup','Setup','Devices, levels and mic positions'],['measure','Measure','Background, left, then right'],['correction','Correction','Target, effort and local smoothing'],['verify','Refine','Verify, improve and choose a pass']];return `<div class="section guide-overview"><div class="section-head">${icon('waveform')}<strong>Room correction</strong></div>${steps.map((s,i)=>`<button class="guide-step ${state.stage===s[0]?'selected':''}" data-stage="${s[0]}"><span class="number">${i+1}</span><div>${s[1]}<small>${s[2]}</small></div></button>`).join('')}</div>`}
function sidebar(){return `<aside class="sidebar"><div class="source-tabs"><button data-action="source-headphones">${icon('headphones')}Phones</button><button class="active">${icon('waveform')}Rooms</button><button data-action="presets">${icon('floppy-disk')}Presets</button></div><div class="library-section">${section('Local measurements','waveform',`<div class="between"><span class="muted small">2 sessions</span><button data-action="new-session">${icon('plus')}New measurement</button></div>`)}${['Desk / nearfield','Living room / sofa'].map((s,i)=>`<div class="session-row ${state.session===s?'selected':''}" data-session="${s}"><span>${s}</span><span class="muted small">${i?'3 points / 18 Oct':'5 points / Today'} · stereo</span></div>`).join('')}${state.savedMeasurements.map(m=>`<div class="session-row" data-load-measurement="${m.id}"><span>${esc(m.name)}</span><span class="muted small">Saved source / ${m.points.length} positions</span></div>`).join('')}</div>${guide()}${section('Measurement','plugs-connected',setupRows())}${section('Listening area','circle',`<div class="setting"><label>Multiple positions</label>${toggle('Multiple positions',state.multi,'multi')}</div><div class="setting"><label>Measurement points</label><button class="icon" data-action="point-minus" aria-label="Remove last point">${icon('minus')}</button><input aria-label="Point count" class="point-count" type="number" min="1" max="24" value="${state.points.length}" data-field="pointCount"><button class="icon" data-action="point-plus" aria-label="Add point">${icon('plus')}</button></div><div class="setting"><label>Point layout</label><button data-stage="setup">Edit positions...</button></div><p class="caption">${state.multi?'Guided mic movement. Verify each position.':'Stationary mic. Automatic refinement available.'}</p>`)}${section('Hands-free measurement','arrows-clockwise',handsFreeSettings())}<div class="sidebar-footer">${icon('circle')} Local measurements stay on this Mac.<br><span class="mono">48 kHz / stereo FIR</span></div></aside>`}
function routes(){return `<section class="route"><div class="section-head">${icon('plugs-connected')}<strong>Measurement route</strong><span class="grow"></span><span class="small muted">Normal capture muted during measurement</span></div><div class="route-grid"><div class="endpoint"><label>Measurement microphone</label><div class="flex">${select('Measurement microphone',['UMIK-1','US-4x4HR','Emulated room / mic'],state.mic,'mic')}${select('Microphone channel',['1','2','3','4'],state.micChannel,'micChannel','channel')}</div></div><div class="route-arrow">${icon('arrow-right')}</div><div class="endpoint"><label>Speaker playback</label><div class="flex">${select('Playback device',['US-4x4HR','Emulated room / output'],state.playback,'playback')}${select('Playback channels',['1 / 2','3 / 4'],state.playbackChannels,'playbackChannels','channel')}</div></div></div></section>`}

function heading(title,subtitle,extra=''){return `<div class="workspace-heading"><div class="between"><h1>${title}</h1>${extra}</div><div class="subtitle">${subtitle}</div></div>`}
function targetStrip(){return `<div class="target-strip"><span class="muted small" style="margin-right:4px">Target</span>${['Gentle','Natural','Warm','Flat'].map(t=>`<button data-target="${t}" class="${state.target===t?'active':''}">${t}</button>`).join('')}<button class="flat small" data-action="auto-fit" aria-pressed="${state.autoFit}" title="Shift target level to fit allowed cuts and boosts">${state.autoFit?'Auto level':'Manual level'} <span class="mono" data-target-offset>${(state.autoFit?state.targetOffset:state.manualOffset).toFixed(1)} dB</span></button><span class="grow"></span><span class="mono muted small">20 Hz-20 kHz</span><button class="flat icon" data-action="target-settings" aria-label="Target settings">${icon('sliders-horizontal')}</button></div>`}

function calculate(c){const raw=frequencies.map(f=>{const r=profileAt(f);return (target(f)-measured(f,c))*state.globalEffort/100*r.effort/100});const correction=raw.map((v,i)=>{const f=frequencies[i],r=profileAt(f);const sigma=r.smooth/2.355;if(!sigma)return Math.max(-state.cut,Math.min(state.boost,v));let sum=0,w=0;for(let k=Math.max(0,i-Math.ceil(sigma*140));k<Math.min(raw.length,i+Math.ceil(sigma*140)+1);k++){const weight=Math.exp(-.5*Math.pow(Math.log2(frequencies[k]/f)/sigma,2));sum+=raw[k]*weight;w+=weight}return Math.max(-state.cut,Math.min(state.boost,sum/w))});return {correction,response:frequencies.map((f,i)=>measured(f,c)+correction[i])}}

document.addEventListener('pointermove',event=>{if(pointDrag){const p=state.points[pointDrag.index];p.x=Math.round(Math.max(-65,Math.min(65,((event.clientX-pointDrag.rect.left)/pointDrag.rect.width*100-50)/.65)));p.y=Math.round(Math.max(-45,Math.min(65,(62-(event.clientY-pointDrag.rect.top)/pointDrag.rect.height*100)/.65)));document.querySelectorAll(`[data-point="${pointDrag.index}"]`).forEach(el=>{el.style.left=50+p.x*.65+'%';el.style.top=62-p.y*.65+'%'});return;}if(edgeDrag){const r=state.regions[edgeDrag.index],neighbor=state.regions[edgeDrag.neighbor],f=graphFrequency(event.clientX,edgeDrag.rect),span=.03;if(edgeDrag.edge==='lo'){const lower=neighbor?neighbor.lo*Math.pow(2,span):(state.regions[edgeDrag.index-1]?.hi??20);r.lo=Math.min(r.hi-1,Math.round(Math.max(lower,Math.min(r.hi/Math.pow(2,span),f))));if(neighbor)neighbor.hi=r.lo;}else{const upper=neighbor?neighbor.hi/Math.pow(2,span):(state.regions[edgeDrag.index+1]?.lo??20000);r.hi=Math.max(r.lo+1,Math.round(Math.min(upper,Math.max(r.lo*Math.pow(2,span),f))));if(neighbor)neighbor.lo=r.hi;}const fd=regionFades(r);r.fadeIn=fd.lower;r.fadeOut=fd.upper;drawGraph();return;}if(drag){drag.current=event.clientX;const svg=document.getElementById('response-plot');svg.querySelector('#creating-region')?.remove();const lo=graphFrequency(Math.min(drag.start,drag.current),drag.rect),hi=graphFrequency(Math.max(drag.start,drag.current),drag.rect),x=f=>44+Math.log10(f/20)/3*(drag.rect.width-62);svg.insertAdjacentHTML('beforeend',`<rect id="creating-region" x="${x(lo)}" y="15" width="${Math.max(0,x(hi)-x(lo))}" height="${drag.rect.height-42}" fill="var(--purple)" fill-opacity=".12" stroke="var(--purple)" stroke-dasharray="3 3"/>`);}});
document.addEventListener('pointerup',()=>{if(pointDrag){pointDrag=null;state.revision++;render();return;}if(edgeDrag){edgeDrag=null;changed();render();return;}if(!drag)return;const d=drag;drag=null;if(Math.abs(d.current-d.start)<8){const f=graphFrequency(d.start,d.rect),index=state.regions.findIndex(r=>f>=r.lo&&f<=r.hi);if(index>=0)state.selectedRegion=index;render();return;}const lo=Math.round(graphFrequency(Math.min(d.start,d.current),d.rect)),hi=Math.round(graphFrequency(Math.max(d.start,d.current),d.rect));if(lo>=hi)return;const profile=profileAt(Math.sqrt(lo*hi)),created={lo,hi,effort:100,smooth:profile.smooth,fadeIn:Math.min(1/6,Math.log2(hi/lo)/4),fadeOut:Math.min(1/6,Math.log2(hi/lo)/4)},next=[];for(const r of state.regions){if(r.hi<=lo||r.lo>=hi)next.push(r);else{if(r.lo<lo)next.push({...r,hi:lo});if(r.hi>hi)next.push({...r,lo:hi});}}next.push(created);next.sort((a,b)=>a.lo-b.lo);state.regions=next;state.selectedRegion=next.indexOf(created);changed();render();toast('Region added: '+rangeLabel(created));});
// Pass snapshots extend the existing attempt records; all data stays in memory.
function recipeSnapshot(){return {policy:'ui-demo-v2',target:state.target,globalEffort:state.globalEffort,regions:structuredClone(state.regions),boost:state.boost,cut:state.cut,autoFit:state.autoFit,targetOffset:state.targetOffset,manualOffset:state.manualOffset};}
function targetSettings(){dialog('Target and filter settings',`<div class="setting"><label>Room target</label>${select('Room target',['Gentle','Natural','Warm','Flat'],state.target,'target')}</div>${targetFitControls()}<div class="setting"><label>Correction range</label><span class="mono">20 Hz-20 kHz</span></div><div class="setting"><label>Phase</label><span>Minimum phase</span></div><div class="setting"><label>FIR length</label><span class="mono">32768 taps / channel</span></div><p class="caption">Effort and regional smoothing are edited directly below the graph. Measurement confidence and gain limits constrain the achievable response.</p>`);}
function automaticSettings(){if(state.moveState&&!state.moveState.paused){state.moveState.paused=true;render();}dialog('Refine',`<div class="setting"><label>Refine after measurement</label>${toggle('Refine after measurement',state.refineAfterMeasure,'refine-after-measure')}</div><p class="caption">Enabled: background noise → baseline L/R → create correction → verify and refine. No extra baseline confirmation. Multiple positions still require mic movement.</p><div class="setting"><label>Maximum candidate attempts</label><input type="number" aria-label="Maximum candidate attempts" data-field="attempts" min="1" max="5" value="${state.attempts}" style="width:64px"></div><div class="setting"><label>Time budget</label><input type="number" aria-label="Refine time budget in minutes" data-field="timeBudget" min="1" max="15" value="${state.timeBudget}" style="width:64px"><span class="mono">min</span></div><div class="setting"><label>Target tolerance / RMS</label><input type="number" aria-label="Target tolerance in dB" data-field="tolerance" min=".5" max="5" step=".1" value="${state.tolerance}" style="width:64px"><span class="mono">dB</span></div><div class="setting"><label>Minimum improvement</label><input type="number" aria-label="Minimum improvement in dB" data-field="minImprovement" min=".05" max="1" step=".05" value="${state.minImprovement}" style="width:64px"><span class="mono">dB</span></div><div class="setting"><label>Measurement strategy</label>${select('Refinement strategy',['Full-range sweeps','Targeted + full final check'],state.strategy,'strategy')}</div><details style="margin-top:10px"><summary style="cursor:pointer;height:28px">Advanced refinement limits</summary><div class="setting"><label>Update damping</label><input type="number" aria-label="Update damping" data-field="stepDamping" min=".1" max="1" step=".1" value="${state.stepDamping}" style="width:64px"></div><div class="setting"><label>Maximum change per pass</label><input type="number" aria-label="Maximum change per pass in dB" data-field="stepLimit" min=".25" max="3" step=".25" value="${state.stepLimit}" style="width:64px"><span class="mono">dB</span></div><div class="setting"><label>Minimum useful-band SNR</label><input type="number" aria-label="Minimum SNR in dB" data-field="minSnr" min="10" max="50" value="${state.minSnr}" style="width:64px"><span class="mono">dB</span></div><div class="setting"><label>Invalid-take retries</label><input type="number" aria-label="Invalid take retries" data-field="invalidRetries" min="0" max="2" value="${state.invalidRetries}" style="width:64px"></div><div class="setting"><label>Allowed boost / cut</label><span class="mono">+${state.boost} / -${state.cut} dB</span><button data-action="target-settings">Edit...</button></div><div class="setting"><label>Target-level fitting</label><span>${state.autoFit?'On':'Off'} / <span class="mono">${(state.autoFit?state.targetOffset:state.manualOffset).toFixed(1)} dB</span></span></div><p class="caption">Sweep duration, slow LF acquisition and mic calibration are in Setup. Effort, regional smoothing and fade widths are edited on the graph.</p></details><div class="hint-box"><strong>Accelerated UI demo</strong><br>To test the full flow, use Measure → Refine. Run demo below starts from the existing baseline. The graph highlights each band being fitted; new passes appear in the right column.</div>`,'<button data-action="close-dialog">Close</button><button class="primary" data-action="start-full-demo" '+(state.running?'disabled':'')+'>Measure → Refine</button><button data-action="run-auto" '+(state.running?'disabled':'')+'>Run demo</button>');}
function applyRecipe(recipe){Object.assign(state,structuredClone(recipe));state.selectedRegion=Math.min(state.selectedRegion,state.regions.length-1);}
function bandMini(bands){const x=f=>Math.log10(f/20)/3*220;return `<svg class="band-mini" viewBox="0 0 220 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10H220" stroke="var(--ghost)"/>${[20,100,1000,10000,20000].map(f=>`<path d="M${x(f)} 6V14" stroke="var(--secondary)" opacity=".4"/>`).join('')}${bands.map(b=>`<rect x="${x(b.lo)}" y="5" width="${Math.max(2,x(b.hi)-x(b.lo))}" height="10" rx="2" fill="var(--purple)" opacity=".65"/>`).join('')}</svg>`;}
function selectedHistory(){return state.attemptRows.find(p=>p.id===state.historyPreview);}
function historyRecord(label,bands,score,decision,base=null){
  const id=state.attemptRows.length,recipe=recipeSnapshot();
  const curves=[0,1].map(c=>{const design=calculate(c);const correction=frequencies.map((f,i)=>{if(label==='Baseline')return 0;if(!base)return design.correction[i]*.75;const inside=bands.some(b=>f>=b.lo&&f<=b.hi);const wanted=inside?design.correction[i]*(decision==='rejected'?1.6:1):base.curves[c].correction[i];if(!inside||!state.activePlan)return wanted;const delta=Math.max(-state.activePlan.stepLimit,Math.min(state.activePlan.stepLimit,(wanted-base.curves[c].correction[i])*state.activePlan.damping));return Math.max(-state.cut,Math.min(state.boost,base.curves[c].correction[i]+delta));});return {correction,response:frequencies.map((f,i)=>measured(f,c)+correction[i])};});
  return {id,parentId:base?.id??Math.max(0,id-1),name:label,left:score,right:score+.2,decision,bands:structuredClone(bands),recipe,curves,scope:'Full range / reference',verified:true,run:state.runNumber,runConfig:state.activePlan?structuredClone(state.activePlan):null};
}
function seedHistory(){const original=recipeSnapshot();state.attemptRows=[];const baseline=historyRecord('Baseline',[],5.9,'baseline');state.attemptRows.push(baseline);const first=historyRecord('Pass 1 / broad fit',[{lo:20,hi:20000}],2.0,'accepted');state.attemptRows.push(first);const second=historyRecord('Pass 2 / bass detail',[{lo:35,hi:260}],1.4,'best',first);state.attemptRows.push(second);state.attemptRows.push(historyRecord('Pass 3 / treble refinement',[{lo:4000,hi:14000}],1.7,'rejected',second));state.bestPass=second.id;applyRecipe(original);}
function passHistory(){const selected=selectedHistory(),shown=selected||state.attemptRows.find(p=>p.id===state.bestPass);return `<section class="history-panel" aria-label="Correction pass history"><header class="history-head">${icon('arrows-clockwise')}<span>Pass history</span><span class="small muted">Changed regions / 20 Hz-20 kHz</span><button class="flat small" data-action="follow-passes" aria-pressed="${state.followPasses}">${state.followPasses?'Following new passes':'Follow new passes'}</button></header><div class="history-list">${state.attemptRows.map(p=>`<button class="history-row ${p.id===state.historyPreview?'selected':''}" data-history="${p.id}" aria-label="Preview ${esc(p.name)}" aria-pressed="${p.id===state.historyPreview}"><span>${esc(p.name)}<small>${p.scope} / run ${p.run}</small></span>${bandMini(p.bands)}<span class="score mono">${p.left.toFixed(1)} dB</span><span class="pass-badge ${p.id===state.preferredPass?'purple':p.id===state.bestPass?'good':p.decision==='rejected'?'warn':'muted'}">${p.id===state.preferredPass?'Your preference'+(p.id===state.bestPass?'<br>Lowest error':''):p.id===state.bestPass?'Lowest error':p.decision==='rejected'?'Not retained':p.decision==='baseline'?'Uncorrected':p.verified?'Verified':'Targeted only'}</span></button>`).join('')}</div><footer class="history-actions"><span class="pass-description">${selected?`Preview: ${esc(selected.name)}`:'Select a pass to compare its filter and measured result.'}</span><button data-action="history-return" ${selected?'':'disabled'}>Back to candidate</button><button data-action="history-audition" ${selected?'':'disabled'}>${state.auditionPass===selected?.id?'Stop audition':'Audition'}</button><button data-action="history-prefer" ${selected?'':'disabled'}>${state.preferredPass===selected?.id?'Preferred':'Prefer by ear'}</button><button class="primary" data-action="history-save" ${selected?'':'disabled'}>Save pass...</button></footer></section>`;}
function previewPass(id){if(state.running){toast('Pause measurement before auditioning a history pass.');return;}if(state.historyPreview===null)state.historyDraft={recipe:recipeSnapshot(),revision:state.revision,verifiedRevision:state.verifiedRevision};const p=state.attemptRows.find(p=>p.id===id);state.historyPreview=id;applyRecipe(p.recipe);state.traces.verified=true;state.help=`Previewing ${p.name}. Highlighted bands changed from its parent pass.`;render();}
function backToCandidate(){if(state.historyDraft){applyRecipe(state.historyDraft.recipe);state.revision=state.historyDraft.revision;state.verifiedRevision=state.historyDraft.verifiedRevision;}state.historyPreview=null;state.historyDraft=null;state.auditionPass=null;state.help='Returned to the current candidate. Pass history is unchanged.';render();}
function savePass(){const p=selectedHistory();if(!p)return;state.pendingSavePass=p.id;dialog('Save history pass',`<div class="setting"><label>Preset name</label><input id="preset-name" aria-label="Preset name" value="${esc(state.session+' / '+p.name)}"></div><p class="caption">${esc(p.scope)} / measured error ${p.left.toFixed(1)} dB RMS.<br>The exact stereo filter and its recipe will be saved, independent of later passes.</p>`,'<button data-action="close-dialog">Cancel</button><button class="primary" data-action="history-save-confirm">Save this pass</button>');}
function handsFreeSettings(){return `<div class="remote-settings"><div class="setting"><label>Hands-free progression</label>${toggle('Hands-free progression',state.handsFree,'hands-free')}</div>${state.handsFree?`<div class="setting"><label>Time to move mic</label><input type="number" aria-label="Time to move mic in seconds" data-field="moveDelay" min="5" max="120" value="${state.moveDelay}"><span class="mono">s</span></div><p class="caption">Show the next position, wait ${state.moveDelay} seconds, then start its noise measurement and sweeps. You can pause the countdown.</p>`:'<p class="caption">Start each position when the microphone is ready.</p>'}</div>`;}
function moveBanner(){if(!state.moveState)return '';const m=state.moveState,p=state.points[m.next];return `<div class="move-countdown" role="status"><span class="seconds">${m.manual?'Ready?':m.remaining+'s'}</span><div class="move-copy">${m.kind==='refine'?'Return mic for Refine':'Move mic'} / point ${m.next+1}: ${esc(p.name)}<small>${p.x}, ${p.y}, ${p.z} cm / ${m.manual?'Confirm microphone placement to continue':m.paused?'Countdown paused':'Next stage starts automatically after the move timer'}</small></div>${m.manual?'':`<button data-action="move-pause">${m.paused?'Resume countdown':'Pause countdown'}</button>`}<button data-action="move-ready">${m.kind==='refine'?'Mic ready → Refine':'Ready now'}</button><button class="danger" data-action="move-stop">Stop</button></div>`;}
function queueNextPoint(completed){const next=completed+1;if(state.multi&&next<state.points.length){state.selectedPoint=next;if(state.handsFree)scheduleMove(next,'measure');else{state.help='Point complete. Move the mic to point '+(next+1)+', then Measure next point.';render();}return;}state.sequenceActive=false;if(state.sequenceMode==='verify'){state.stage='verify';state.help='Guided verification pass complete. Mic positions were visited explicitly.';render();return;}if(state.refineAfterMeasure){if(state.multi&&completed!==0)scheduleMove(0,'refine');else runAuto();}else{state.stage='correction';state.help='Baseline complete. Correction prepared from the saved measurement.';render();}}
function scheduleMove(next,kind){clearInterval(moveTimer);state.selectedPoint=next;state.stage='measure';state.moveState={next,kind,remaining:state.moveDelay,paused:!state.handsFree,manual:!state.handsFree};state.help=kind==='refine'?'Baseline complete. Return the mic to the reference for automatic refinement.':'Move the mic while the output is silent.';render();if(!state.handsFree)return;moveTimer=setInterval(()=>{if(state.moveState.paused)return;state.moveState.remaining--;if(state.moveState.remaining<=0)startPendingMove();else render();},1000);}
function startPendingMove(){const kind=state.moveState.kind;clearInterval(moveTimer);moveTimer=null;state.moveState=null;if(kind==='refine')runAuto();else runPoint();}
function startMeasurementSequence(){if(state.running)return;document.getElementById('overlay').innerHTML='';state.stage='measure';if(!state.sequenceActive){state.sequenceMode='measure';state.sequenceActive=true;}runPoint();}
Object.assign(state,{historyPreview:null,historyDraft:null,preferredPass:null,bestPass:null,auditionPass:null,savedPasses:[],pendingSavePass:null,runNumber:1,handsFree:false,moveDelay:15,moveState:null,refineAfterMeasure:true,activePlan:null,sequenceActive:false,sequenceMode:'measure',stepDamping:.5,stepLimit:1.5,timeBudget:5,invalidRetries:1,minSnr:20,followPasses:true,pendingFollow:false,fitBands:[],candidateCurves:null,tolerance:1.5,minImprovement:.25,strategy:'Full-range sweeps',stopReason:'',measurementData:null,savedMeasurements:JSON.parse(localStorage.getItem('irresponsible-room-prototype-measurements-v1')||'[]')});
let moveTimer=null,edgeDrag=null,drag=null;
fitTarget();seedHistory();
render();window.addEventListener('resize',drawGraph);
</script>
